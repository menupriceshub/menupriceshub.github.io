<script>
(function () {
  /* =========================
     1. CATEGORY TABS GENERATE KARO
  ========================= */
  const categories = [
    { name: "All", url: "/restaurants/" },
    { name: "Asian Food", url: "/asian-food" },
    { name: "Burger", url: "/burger" },
    { name: "Cafe", url: "/cafe" },
    { name: "Desserts", url: "/desserts" },
    { name: "Healthy Food", url: "/healthy-food" },
    { name: "Italian", url: "/italian" },
    { name: "Mexican", url: "/mexican" },
    { name: "Pizza", url: "/pizza" }
  ];

  const navContainer = document.getElementById("category-nav1");

  categories.forEach(cat => {
    const a = document.createElement("a");
    a.href = cat.url;
    a.className = "cat-tab";
    a.textContent = cat.name;
    navContainer.appendChild(a);
  });

  /* =========================
     2. ACTIVE TAB SET KARO (URL ke last segment se)
  ========================= */
  const categoryTabs = document.querySelectorAll(".cat-tab");
  if (!categoryTabs.length) return;

  const currentPath = window.location.pathname
    .replace(/\/+$/, "")
    .split("/")
    .filter(Boolean)
    .pop() || "";

  let activeTab = null;

  categoryTabs.forEach(tab => {
    const tabPath = tab.getAttribute("href")
      .replace(/\/+$/, "")
      .split("/")
      .filter(Boolean)
      .pop() || "";

    tab.classList.remove("active-tab2");

    if (tabPath === currentPath) {
      tab.classList.add("active-tab2");
      activeTab = tab;
    }
  });

  /* =========================
     3. ACTIVE TAB KO AUTO-CENTER SCROLL KARO
  ========================= */
  if (activeTab) {
    activeTab.scrollIntoView({
      behavior: "smooth",
      inline: "center",
      block: "nearest"
    });
  }
})();
</script>

<script>
const slides=document.querySelectorAll(".slide");
const dotsContainer=document.querySelector(".dots");
let current=0;

slides.forEach((_,i)=>{
 const dot=document.createElement("div");
 dot.classList.add("dot");
 if(i===0) dot.classList.add("active");

 dot.addEventListener("click",()=>{
   current=i;
   showSlide();
 });

 dotsContainer.appendChild(dot);
});

const dots=document.querySelectorAll(".dot");

function showSlide(){
 slides.forEach(s=>s.classList.remove("active"));
 dots.forEach(d=>d.classList.remove("active"));

 slides[current].classList.add("active");
 dots[current].classList.add("active");
}

function nextSlide(){
 current=(current+1)%slides.length;
 showSlide();
}

function prevSlide(){
 current=(current-1+slides.length)%slides.length;
 showSlide();
}

document.querySelector(".next").onclick=nextSlide;
document.querySelector(".prev").onclick=prevSlide;

let auto=setInterval(nextSlide,5000);

/* Touch Swipe */
let startX=0;

document.querySelector(".hero-slider")
.addEventListener("touchstart",(e)=>{
 startX=e.touches[0].clientX;
});

document.querySelector(".hero-slider")
.addEventListener("touchend",(e)=>{
 let endX=e.changedTouches[0].clientX;

 if(startX-endX>50){
   nextSlide();
 }

 if(endX-startX>50){
   prevSlide();
 }
});
</script>

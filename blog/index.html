<script>
const path = location.pathname
  .replace(".html", "")
  .split("/")
  .filter(Boolean);

let itemList = [{
  "@type": "ListItem",
  "position": 1,
  "name": "Home",
  "item": location.origin + "/"
}];

let url = location.origin;

path.forEach((part, index) => {
  url += "/" + part;

  itemList.push({
    "@type": "ListItem",
    "position": index + 2,
    "name": part.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()),
    "item": url + ".html"
  });
});

const schema = {
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": itemList
};

const script = document.createElement("script");
script.type = "application/ld+json";
script.text = JSON.stringify(schema);
document.head.appendChild(script);
</script>

<!-- blog -->

<div id="mph-blog-list"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const container = document.getElementById("mph-blog-list");

  if (!container) return;

  const BLOG_JSON = "/data/blog-post.json";

  const POSTS_PER_LOAD = 5;

  let allPosts = [];
  let currentIndex = 0;

  fetch(BLOG_JSON)
    .then(response => {
      if (!response.ok) {
        throw new Error("Failed to load blog JSON");
      }

      return response.json();
    })

    .then(data => {

      /*
       * Featured + posts dono ko include karna hai
       * Featured ko bhi blog list me show kiya jayega.
       */

      allPosts = [];

      if (data.featured) {
        allPosts.push(data.featured);
      }

      if (Array.isArray(data.posts)) {
        allPosts = allPosts.concat(data.posts);
      }

      renderPosts();

    })

    .catch(error => {

      console.error("Blog Load Error:", error);

      container.innerHTML = `
        <p class="mph-blog-error">
          Unable to load blog posts.
        </p>
      `;

    });


  function renderPosts() {

    const postsToShow = allPosts.slice(
      currentIndex,
      currentIndex + POSTS_PER_LOAD
    );

    postsToShow.forEach(post => {

      const article = document.createElement("article");

      article.className = "mph-blog-card";

      article.innerHTML = `

        <a href="${post.url}" class="mph-blog-image-link">

          <img
            src="${post.image}"
            alt="${post.title}"
            loading="lazy"
          >

        </a>

        <div class="mph-blog-content">

          <h2 class="mph-blog-title">
            ${post.title}
          </h2>

          <a
            href="${post.url}"
            class="mph-blog-read-more"
          >
            Read More
            <i class="fa-solid fa-arrow-right"></i>
          </a>

        </div>

      `;

      container.appendChild(article);

    });


    currentIndex += postsToShow.length;

    updateLoadMoreButton();

  }


  function updateLoadMoreButton() {

    let button = document.getElementById("mph-load-more");

    if (currentIndex < allPosts.length) {

      if (!button) {

        button = document.createElement("button");

        button.id = "mph-load-more";

        button.className = "mph-load-more";

        button.textContent = "Load More";

        button.addEventListener("click", () => {

          renderPosts();

        });

        container.parentNode.appendChild(button);

      }

    } else {

      if (button) {
        button.remove();
      }

    }

  }

});
  
</script>

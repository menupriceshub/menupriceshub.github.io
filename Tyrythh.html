<!-- SITEMAP JAVASCRIPT -->
<script>

document.addEventListener("DOMContentLoaded", function() {

const sitemapContainer = document.getElementById("sitemap-list");

const sitemapURL = "/sitemap.xml";

const groups = [
  {
    name: "Main Pages",
    match: path => path === "/"
  },
  {
    name: "Blog Articles",
    match: path => path.startsWith("/blog/")
  },
  {
    name: "Restaurant Categories",
    match: path => path === "/categories/" || path.startsWith("/categories/")
  },
  {
    name: "Cities",
    match: path => path === "/cities/" || path.startsWith("/cities/")
  },
  {
    name: "Restaurants",
    match: path => path === "/restaurants/" || path.startsWith("/restaurants/")
  },
  {
    name: "Other Pages",
    match: path => true
  }
];

function getPageTitle(url) {

  const pathname = new URL(url).pathname;

  if (pathname === "/") {
    return "Home";
  }

  const slug = pathname
    .replace(/\/$/, "")
    .split("/")
    .pop()
    .replace(/\.html$/i, "");

  return slug
    .replace(/[-_]+/g, " ")
    .replace(/\b\w/g, char => char.toUpperCase());

}

fetch(sitemapURL)

.then(response => {

  if (!response.ok) {
    throw new Error("Sitemap file not found");
  }

  return response.text();

})

.then(xmlText => {

  const parser = new DOMParser();

  const xml = parser.parseFromString(
    xmlText,
    "application/xml"
  );

  if (xml.querySelector("parsererror")) {
    throw new Error("Invalid sitemap XML");
  }

  const urls = Array.from(
    xml.querySelectorAll("url > loc")
  )
  .map(loc => loc.textContent.trim())
  .filter(url => {

    try {
      const parsed = new URL(url);

      return parsed.origin === location.origin &&
             ["http:", "https:"].includes(parsed.protocol);

    } catch {
      return false;
    }

  });

  if (!urls.length) {
    throw new Error("No sitemap URLs found");
  }

  sitemapContainer.innerHTML = "";

  const usedURLs = new Set();

  groups.forEach(group => {

    const items = urls.filter(url => {

      if (usedURLs.has(url)) return false;

      const path = new URL(url).pathname;

      if (group.match(path)) {
        usedURLs.add(url);
        return true;
      }

      return false;

    });

    if (!items.length) return;

    const section = document.createElement("div");

    section.className = "sitemap-section";

    const heading = document.createElement("h2");

    heading.textContent = group.name;

    const count = document.createElement("span");

    count.className = "sitemap-count";

    count.textContent = "(" + items.length + ")";

    heading.appendChild(count);

    const list = document.createElement("ul");

    items.forEach(url => {

      const li = document.createElement("li");

      const link = document.createElement("a");

      link.href = url;

      link.textContent = getPageTitle(url);

      li.appendChild(link);

      list.appendChild(li);

    });

    section.appendChild(heading);

    section.appendChild(list);

    sitemapContainer.appendChild(section);

  });

})

.catch(error => {

  console.error("HTML Sitemap Error:", error);

  sitemapContainer.innerHTML = "";

  const errorBox = document.createElement("div");

  errorBox.className = "sitemap-error";

  errorBox.textContent =
    "Unable to load sitemap. Please try again later.";

  sitemapContainer.appendChild(errorBox);

});

});

</script>

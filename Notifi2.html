<button id="allowNotifications">
  🔔 Allow Notifications
</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-messaging.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const messaging = getMessaging(app);
const db = getFirestore(app);

const vapidKey = "YOUR_VAPID_KEY";

document.getElementById("allowNotifications").addEventListener("click", async () => {

  try {

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      alert("Notification permission denied");
      return;
    }

    const token = await getToken(messaging, {
      vapidKey: vapidKey
    });

    if (!token) {
      alert("Token not generated");
      return;
    }

    await setDoc(doc(db, "subscribers", token), {
      token: token,
      subscribedAt: new Date().toISOString(),
      userAgent: navigator.userAgent
    });

    alert("Notifications Enabled Successfully!");

    console.log("FCM Token:", token);

  } catch (error) {
    console.error(error);
    alert("Error: " + error.message);
  }

});
</script>

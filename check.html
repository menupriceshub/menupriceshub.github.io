<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA Theme -->
<meta name="theme-color" content="#007bff">

<!-- iOS support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- App icon for iOS -->
<link rel="apple-touch-icon" href="icon.png">

<!-- Manifest file (IMPORTANT) -->
<link rel="manifest" href="manifest.json">

<title>PWA Detect Button</title>

<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  padding:50px;
  background:#f5f5f5;
}

#installBtn{
  padding:15px 25px;
  font-size:18px;
  background:#007bff;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  display:none; /* default hidden */
}

#installBtn:hover{
  background:#0056b3;
}

.badge{
  margin-top:20px;
  font-size:16px;
  color:#333;
}
</style>
</head>
<body>

<h2>PWA Detection System</h2>

<button id="installBtn">Install App</button>

<div class="badge" id="statusText"></div>

<script>
// ✅ PWA detection function
function isPWA() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
  const isIOS = window.navigator.standalone === true;
  const isFullscreen = window.matchMedia('(display-mode: fullscreen)').matches;

  return isStandalone || isIOS || isFullscreen;
}

// ✅ On load check
window.addEventListener("load", () => {
  const btn = document.getElementById("installBtn");
  const status = document.getElementById("statusText");

  if (isPWA()) {
    btn.style.display = "none";
    status.innerText = "🚀 App is running in PWA mode";
  } else {
    btn.style.display = "inline-block";
    status.innerText = "🌐 Running in Browser mode";
  }
});

// Optional click action
document.getElementById("installBtn").addEventListener("click", () => {
  alert("Install prompt yaha integrate kar sakte ho (beforeinstallprompt event)");
});
</script>

</body>
</html>

<input type="text" id="searchBox" placeholder="Search..." class="search-input" />
<div id="results"></div>

<style>
.search-input{
    width:100%;
    padding:10px 14px;
    border:1px solid #ddd;
    border-radius:20px;
    font-size:15px;
    box-sizing:border-box;
    margin-bottom:10px;
}

.search-card{
    display:flex;
    gap:12px;
    background:#fff;
    border-radius:12px;
    padding:10px;
    margin:12px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.search-img{
    width:110px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
}

.search-info{
    flex:1;
}

.search-info h3{
    margin:0 0 6px;
    font-size:18px;
}

.search-info p{
    margin:0 0 10px;
    color:#666;
    font-size:14px;
}

.view-btn{
    display:inline-block;
    padding:8px 16px;
    background:#ff3b30;
    color:#fff;
    border-radius:20px;
    text-decoration:none;
}

.no-result{
    text-align:center;
    color:#888;
    padding:20px;
}
</style>

<script>
let data = [];

const searchBox = document.getElementById("searchBox");
const results = document.getElementById("results");

// Load JSON
fetch("/search-data.json")
  .then(res => res.json())
  .then(json => {
    data = json;

    // URL se search
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q");

    if (q) {
      searchBox.value = q;
      searchData(q);
    }
  })
  .catch(err => {
    console.error("Failed to load search-data.json:", err);
    results.innerHTML = "<div class='no-result'>Data load nahi ho payi</div>";
  });

searchBox.addEventListener("input", function () {
  const q = this.value.trim();

  const url = new URL(window.location);

  if (q) {
    url.searchParams.set("q", q);
  } else {
    url.searchParams.delete("q");
  }

  history.replaceState({}, "", url);

  searchData(q);
});

function searchData(keyword) {
  keyword = keyword.toLowerCase().trim();

  if (!keyword) {
    results.innerHTML = "";
    return;
  }

  const filtered = data.filter(item =>
    (item.title || "").toLowerCase().includes(keyword) ||
    (item.content || "").toLowerCase().includes(keyword)
  );

  if (!filtered.length) {
    results.innerHTML = "<div class='no-result'>No results found</div>";
    return;
  }

  results.innerHTML = filtered.map(item => `
<div class="search-card">
    <img src="${item.image || ''}" alt="${item.title || ''}" class="search-img">

    <div class="search-info">
        <h3>${item.title || ''}</h3>
        <p>${item.description || ''}</p>

        <a href="${item.url || '#'}" class="view-btn">View Menu</a>
    </div>
</div>
`).join("");
}

function openSearch(keyword) {
  keyword = decodeURIComponent(keyword);

  const url = new URL(window.location);
  url.searchParams.set("q", keyword);

  history.pushState({}, "", url);

  searchBox.value = keyword;
  searchData(keyword);
}
</script>

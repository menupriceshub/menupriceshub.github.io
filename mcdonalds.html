<html><body>


<script>

const slug = location.pathname.split("/").pop().replace(".html", "");

fetch("/data/faq.json")
  .then(res => res.json())
  .then(data => {
    const page = data.find(item => item.slug === slug);

    if (!page) return;

    let html = "";

    page.faq.forEach(faq => {
      html += `
        <details>
          <summary>${faq.question}</summary>
          <p>${faq.answer}</p>
        </details>
      `;
    });

    document.getElementById("faq").innerHTML = html;
  });
</script>

<div id="faq"></div>
</body></html>

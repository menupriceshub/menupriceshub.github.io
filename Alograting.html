<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Star Rating with Google Sign-In</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #fff;
    padding: 32px 28px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    width: 360px;
    text-align: center;
  }
  h2 { margin-top: 0; color: #222; }
  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .user-info img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
  }
  .user-info span { font-weight: 600; color: #333; }

  button.google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    color: #444;
    transition: box-shadow 0.2s;
  }
  button.google-btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  button.google-btn img { width: 20px; height: 20px; }

  button.logout-btn {
    margin-top: 16px;
    background: none;
    border: none;
    color: #d9534f;
    cursor: pointer;
    font-size: 14px;
    text-decoration: underline;
  }

  .stars {
    font-size: 40px;
    cursor: pointer;
    user-select: none;
    margin: 16px 0 8px;
  }
  .star {
    color: #ccc;
    transition: color 0.15s, transform 0.1s;
    display: inline-block;
  }
  .star.filled { color: #ffb400; }
  .star:hover { transform: scale(1.15); }

  .rating-label {
    color: #555;
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 4px;
  }

  .status {
    font-size: 13px;
    color: #28a745;
    min-height: 18px;
  }

  #hidden-section { display: none; }
</style>
</head>
<body>

<div class="card">
  <h2>тнР Rate Us</h2>

  <!-- Signed OUT view -->
  <div id="signed-out">
    <p style="color:#666; font-size:14px;">Apni rating dene ke liye sign in karein</p>
    <button class="google-btn" id="google-signin-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Sign in with Google
    </button>
  </div>

  <!-- Signed IN view -->
  <div id="signed-in" style="display:none;">
    <div class="user-info">
      <img id="user-photo" src="" alt="" />
      <span id="user-name"></span>
    </div>

    <div class="rating-label">Aapki rating:</div>
    <div class="stars" id="stars-container">
      <span class="star" data-value="1">&#9733;</span>
      <span class="star" data-value="2">&#9733;</span>
      <span class="star" data-value="3">&#9733;</span>
      <span class="star" data-value="4">&#9733;</span>
      <span class="star" data-value="5">&#9733;</span>
    </div>
    <div class="status" id="status-msg"></div>

    <button class="logout-btn" id="logout-btn">Sign out</button>
  </div>
</div>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  // --- Firebase config ---
  const firebaseConfig = {
    apiKey: "AIzaSyCod1_H1HEGw2wUg3lzkC1OCKNfzQ17eho",
    authDomain: "menupriceshub-964c0.firebaseapp.com",
    projectId: "menupriceshub-964c0",
    storageBucket: "menupriceshub-964c0.firebasestorage.app",
    messagingSenderId: "846490180206",
    appId: "1:846490180206:web:dfac3b25ad118c0810e47f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const signedOutDiv = document.getElementById("signed-out");
  const signedInDiv = document.getElementById("signed-in");
  const userPhoto = document.getElementById("user-photo");
  const userName = document.getElementById("user-name");
  const starsContainer = document.getElementById("stars-container");
  const stars = document.querySelectorAll(".star");
  const statusMsg = document.getElementById("status-msg");

  let currentUser = null;

  // ---- Google Sign-In ----
  document.getElementById("google-signin-btn").addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      console.error(err);
      alert("Sign-in failed: " + err.message);
    }
  });

  // ---- Sign Out ----
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
  });

  // ---- Auth state listener ----
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      signedOutDiv.style.display = "none";
      signedInDiv.style.display = "block";
      userPhoto.src = user.photoURL || "";
      userName.textContent = user.displayName || user.email;

      // Sirf isi user ki rating fetch karo (doc id = uid)
      await loadUserRating(user.uid);
    } else {
      currentUser = null;
      signedOutDiv.style.display = "block";
      signedInDiv.style.display = "none";
      renderStars(0);
    }
  });

  // ---- Load only this user's own rating ----
  async function loadUserRating(uid) {
    statusMsg.textContent = "Loading...";
    const ratingRef = doc(db, "ratings", uid);
    const snap = await getDoc(ratingRef);
    if (snap.exists()) {
      renderStars(snap.data().rating || 0);
      statusMsg.textContent = "Aapki saved rating dikh rahi hai";
    } else {
      renderStars(0);
      statusMsg.textContent = "Aapne abhi tak rating nahi di hai";
    }
  }

  // ---- Save rating (create/update doc for this uid only) ----
  async function saveRating(value) {
    if (!currentUser) return;
    statusMsg.textContent = "Saving...";
    const ratingRef = doc(db, "ratings", currentUser.uid);
    await setDoc(ratingRef, {
      uid: currentUser.uid,
      name: currentUser.displayName || "",
      email: currentUser.email || "",
      rating: value,
      updatedAt: serverTimestamp()
    }, { merge: true });
    statusMsg.textContent = "Rating saved!";
  }

  // ---- Star UI ----
  function renderStars(value) {
    stars.forEach(star => {
      const starValue = Number(star.dataset.value);
      star.classList.toggle("filled", starValue <= value);
    });
  }

  stars.forEach(star => {
    star.addEventListener("click", async () => {
      const value = Number(star.dataset.value);
      renderStars(value);
      await saveRating(value);
    });

    star.addEventListener("mouseenter", () => {
      const value = Number(star.dataset.value);
      stars.forEach(s => {
        s.style.color = Number(s.dataset.value) <= value ? "#ffb400" : "#ccc";
      });
    });
  });

  starsContainer.addEventListener("mouseleave", async () => {
    // hover ke baad wapas actual saved rating dikhado
    if (currentUser) {
      const ratingRef = doc(db, "ratings", currentUser.uid);
      const snap = await getDoc(ratingRef);
      renderStars(snap.exists() ? snap.data().rating || 0 : 0);
    }
  });
</script>
</body>
</html>

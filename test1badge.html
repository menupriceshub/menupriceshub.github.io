<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Notification Badge</title>

<style>
#bell{
    position:relative;
    display:inline-block;
    font-size:35px;
    text-decoration:none;
}

#badge{
    position:absolute;
    top:-8px;
    right:-10px;
    min-width:20px;
    height:20px;
    background:red;
    color:#fff;
    border-radius:50%;
    font-size:12px;
    text-align:center;
    line-height:20px;
    display:none;
    font-weight:bold;
}
</style>

</head>
<body>

<a href="notification.html" id="bell">
    🔔
    <span id="badge"></span>
</a>

<script>

async function checkNotifications(){

    const res = await fetch("notifications.json?t="+Date.now());

    const data = await res.json();

    const version = data.version;

    const seenVersion = Number(localStorage.getItem("seenVersion") || 0);

    const unread = version - seenVersion;

    const badge = document.getElementById("badge");

    if(unread>0){

        badge.style.display="block";
        badge.innerHTML=unread;

    }else{

        badge.style.display="none";

    }

}

checkNotifications();

document.getElementById("bell").addEventListener("click",async()=>{

    const res = await fetch("notifications.json");

    const data = await res.json();

    localStorage.setItem("seenVersion",data.version);

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Restaurant Review</title>
<div id="site-header"></div>
<script src="header-widget.js" defer></script>
<!-- Font Awesome Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script type="module" src="notification-widget.js"></script>

<!-- Review Widget CSS -->
<link rel="stylesheet" href="review-widget.css">


</head>


<body>


<!-- Review Widget Load Here -->

<section id="star-rating"></section>



<!-- Review Widget JS -->

<script src="review-widget.js"></script>

<script>
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;

    document.getElementById('installBtn').style.display = 'inline-block';
});

document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();

    const { outcome } = await deferredPrompt.userChoice;

    console.log('Install Result:', outcome);

    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
});

window.addEventListener('appinstalled', () => {
    alert('App Installed Successfully!');
});
</script>

<!-- Service Worker Register -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
        .then(reg => {
            console.log('Service Worker Registered');
        })
        .catch(err => {
            console.log('SW Error:', err);
        });
    });
}
</script>

</body>
</html>

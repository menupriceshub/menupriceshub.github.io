<div id="sitemap-list"></div>

<script>
fetch("data/restaurants.json")
.then(res => res.json())
.then(data => {

let html = "<ul>";

data.forEach(item => {
  html += `
  <li>
    <a href="/${item.url}">
      ${item.name} - ${item.city}
    </a>
  </li>`;
});

html += "</ul>";

document.getElementById("sitemap-list").innerHTML = html;

});
</script>

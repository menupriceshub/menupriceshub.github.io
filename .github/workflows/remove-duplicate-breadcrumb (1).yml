name: Remove duplicate breadcrumb schema
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate inline breadcrumb script
        run: |
          python3 - <<'PY'
          import glob, re
          pat = re.compile(r'[ \t]*<script>\s*const path = location\.pathname.*?document\.head\.appendChild\(script\);\s*</script>[ \t]*\n?', re.S)
          n = 0
          for f in sorted(glob.glob("**/*.html", recursive=True)):
              if f.startswith(("data/", "js/", "styles/", ".git/")):
                  continue
              s = open(f, encoding="utf-8").read()
              if "breadcrumb1.js" not in s:
                  continue
              s2, k = pat.subn("", s)
              if k:
                  open(f, "w", encoding="utf-8", newline="").write(s2)
                  n += 1
          print(n, "pages fixed")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove duplicate breadcrumb schema"
          git push
